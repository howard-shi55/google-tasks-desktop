name: Build Windows

# Build downloadable artifacts only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # This runner supplies MSVC and the Windows SDK; no local install is needed.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Keep compatibility with the repository's existing binary bun.lockb.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Exercise origin isolation and idempotent injection before compiling.
      - name: Check theme injection
        run: bun run test

      - name: Typecheck Rust
        working-directory: src-tauri
        run: cargo check --locked

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # Test the actual Rust navigation guard, not only the injected JavaScript guard.
      - name: Test native regressions
        working-directory: src-tauri
        run: cargo test --locked --lib

      - name: Build Windows executable and NSIS installer
        run: bun run tauri build --bundles nsis -- --locked

      # Store outputs without creating a release or requiring repository write access.
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: google-tasks-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
